---
cluster:
  - cbe
form:
  - jupyter_version
  - mode
  - extra_jupyter_args
  - working_dir
  - auto_queues
  - bc_num_hours
  - num_cores
  - gres
  - gres_count
  - node
  - bc_email_on_started
attributes:
  jupyter_version:
    widget: 'select'
    cachable: true
    required: true
    label: "Jupyter version"
    help: "Choose your Jupyter version"
    options:
      - ['Jupyter v4.4.9-GCCcore-14.3.0', '4.4.9-GCCcore-14.3.0']

  mode:
    widget: "radio"
    value: "1"
    options:
      - ["Jupyter Lab", "1"]
      - ["Jupyter Notebook", "0"]
  extra_jupyter_args:
    widget: "text_field"
    label: "Extra Jupyter arguments"
    value: ''
    help: "Additional command-line arguments appended to the `jupyter lab`/`jupyter notebook` launch command."
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false   # Only display directories
    help: "Select your project directory; defaults to $HOME"
  auto_queues:
    value: 'true'
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    value: 1
  gres:
    widget: select
    label: "Resources"
    help: "Select GPU or other Slurm GRES resources (partition g only)"
    required: true
    options:
      - ["NVIDIA B200 MIG slice (23 GB)", "gpu:nvidia_b200_1g.23gb"]
      - ["NVIDIA B200 GPU (full)", "gpu:nvidia_b200"]
  gres_count:
    widget: number_field
    label: "Resource count"
    help: "Count of GPU or other Slurm GRES resources"
    min: 1
    required: false
    step: 1
    value: 1
  node:
    widget: text_field
    label: "Node name"
    value: ''
    help: "Select a particular node or leave empty to let Slurm pick the next available"
